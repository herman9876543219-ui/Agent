<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14110f">
<title>Nova</title>
<style>
  :root{--bg:#14110f;--panel:#201b18;--ink:#f3ece4;--mute:#a1968b;--glow:#6ee7c8;--me:#2d2723}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
  header h1{font-size:20px;margin:0;font-weight:600;letter-spacing:.02em}
  header button{background:none;border:1px solid #3a322d;color:var(--mute);padding:6px 12px;border-radius:8px;font-size:14px}
  #log{flex:1;overflow-y:auto;padding:8px 18px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
  .me{align-self:flex-end;background:var(--me)}
  .nova{align-self:flex-start;background:var(--panel);border-left:3px solid var(--glow)}
  #dock{padding:14px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:12px}
  #status{color:var(--mute);font-size:14px;min-height:20px}
  #mic{width:84px;height:84px;border-radius:50%;border:2px solid var(--glow);background:var(--panel);color:var(--glow);font-size:30px}
  #mic.on{background:var(--glow);color:#0b1f1a;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 14px rgba(110,231,200,.15)}}
  @media (prefers-reduced-motion:reduce){#mic.on{animation:none}}
  form{display:flex;gap:8px;width:100%}
  input{flex:1;background:var(--panel);border:1px solid #3a322d;color:var(--ink);padding:11px 14px;border-radius:10px;font-size:16px}
  form button{background:var(--glow);color:#0b1f1a;border:0;padding:0 18px;border-radius:10px;font-weight:600}
  button:focus-visible,input:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
  dialog{background:var(--panel);color:var(--ink);border:1px solid #3a322d;border-radius:14px;width:min(92vw,420px)}
  dialog input{width:100%;margin:6px 0 14px}
  dialog label{font-size:14px;color:var(--mute)}
  dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin:0}
  dialog button{padding:8px 14px;border-radius:8px;border:1px solid #3a322d;background:none;color:var(--ink)}
  dialog button.go{background:var(--glow);color:#0b1f1a;border:0}
</style>
</head>
<body>
<header><h1>Nova</h1><button id="cfg">Settings</button></header>
<div id="log" aria-live="polite"></div>
<div id="dock">
  <div id="status">Tap the mic and speak</div>
  <button id="mic" aria-label="Talk to Nova">🎤</button>
  <form id="f"><input id="t" placeholder="Or type a message" autocomplete="off"><button>Send</button></form>
</div>

<dialog id="dlg">
  <label for="key">Groq API key (saved only on this phone)</label>
  <input id="key" type="password" placeholder="gsk_...">
  <label for="model">Model</label>
  <input id="model" value="llama-3.3-70b-versatile">
  <menu><button id="cancel" type="button">Close</button><button id="save" class="go" type="button">Save</button></menu>
</dialog>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), statusEl = $('status'), mic = $('mic');
const store = { get:(k,d)=>localStorage.getItem(k)||d, set:(k,v)=>localStorage.setItem(k,v) };
let history = [];
let listening = false;

const SYSTEM = "You are Nova, a friendly, quick voice assistant on the user's Android phone. Keep replies short (1-3 sentences) because they are spoken aloud. No markdown, no emojis, no lists.";

function add(role, text){
  const d = document.createElement('div');
  d.className = 'm ' + (role==='me'?'me':'nova');
  d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  speechSynthesis.speak(u);
}

function say(text){ add('nova', text); speak(text); }

async function pickContact(){
  if(!('contacts' in navigator && 'ContactsManager' in window)){
    say("Contact access isn't supported in this browser.");
    return null;
  }
  try{
    const r = await navigator.contacts.select(['name','tel'], {multiple:false});
    return r[0] || null;
  }catch(e){ return null; }
}

// Local commands that run on the phone without needing the AI
async function localCommand(q){
  const s = q.toLowerCase().trim();
  if(/^(what('s| is) the )?time\b|what time is it/.test(s)){
    say("It's " + new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})); return true;
  }
  if(/what('s| is) (the )?date|today's date|what day is it/.test(s)){
    say("Today is " + new Date().toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'})); return true;
  }
  let m;
  if((m = s.match(/^(?:open|go to)\s+(youtube|google|whatsapp|facebook|twitter|instagram|tiktok|gmail|maps)$/))){
    const urls = {youtube:'https://youtube.com',google:'https://google.com',whatsapp:'https://wa.me/',facebook:'https://facebook.com',twitter:'https://x.com',instagram:'https://instagram.com',tiktok:'https://tiktok.com',gmail:'https://mail.google.com',maps:'https://maps.google.com'};
    say("Opening " + m[1]); setTimeout(()=>window.open(urls[m[1]], '_blank'), 900); return true;
  }
  if((m = s.match(/^(?:search|google)(?: for)?\s+(.+)/))){
    say("Searching for " + m[1]); setTimeout(()=>window.open('https://www.google.com/search?q='+encodeURIComponent(m[1]), '_blank'), 900); return true;
  }
  if((m = s.match(/^play\s+(.+)/))){
    say("Playing " + m[1] + " on YouTube"); setTimeout(()=>window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(m[1]), '_blank'), 900); return true;
  }
  if(/^(call|phone|dial)\b/.test(s)){
    say("Pick who to call.");
    const c = await pickContact();
    if(c && c.tel && c.tel[0]){ say("Calling " + (c.name?.[0]||"them")); setTimeout(()=>location.href='tel:'+c.tel[0].replace(/\s/g,''), 900); }
    return true;
  }
  if(/^(text|message|whatsapp)\b/.test(s) && !/^whatsapp$/.test(s)){
    const body = (s.match(/(?:saying|that|say)\s+(.+)$/)||[])[1] || '';
    say("Pick who to message.");
    const c = await pickContact();
    if(c && c.tel && c.tel[0]){
      const num = c.tel[0].replace(/[^\d]/g,'');
      say("Opening WhatsApp for " + (c.name?.[0]||"them"));
      setTimeout(()=>window.open('https://wa.me/'+num+(body?'?text='+encodeURIComponent(body):''), '_blank'), 900);
    }
    return true;
  }
  return false;
}

async function ask(q){
  add('me', q);
  statusEl.textContent = 'Thinking...';
  if(await localCommand(q)){ statusEl.textContent = 'Tap the mic and speak'; return; }
  const key = store.get('nova_key','');
  if(!key){ say("Add your Groq API key in Settings first."); statusEl.textContent=''; return; }
  history.push({role:'user', content:q});
  history = history.slice(-12);
  try{
    const r = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify({model:store.get('nova_model','llama-3.3-70b-versatile'),messages:[{role:'system',content:SYSTEM},...history],max_tokens:300})
    });
    const j = await r.json();
    if(!r.ok) throw new Error(j.error?.message || r.status);
    const a = j.choices[0].message.content.trim();
    history.push({role:'assistant', content:a});
    say(a);
  }catch(e){ say("Something went wrong: " + e.message); }
  statusEl.textContent = 'Tap the mic and speak';
}

// Speech recognition
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec;
if(SR){
  rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onstart = ()=>{ listening = true; mic.classList.add('on'); statusEl.textContent = 'Listening...'; };
  rec.onend = ()=>{ listening = false; mic.classList.remove('on'); if(statusEl.textContent==='Listening...') statusEl.textContent='Tap the mic and speak'; };
  rec.onerror = e=>{ statusEl.textContent = e.error==='not-allowed' ? 'Allow microphone access in Chrome site settings.' : 'Mic error: '+e.error; };
  rec.onresult = e=> ask(e.results[0][0].transcript);
}
mic.onclick = ()=>{
  if(!rec){ say("Voice input isn't supported here. Use Chrome on Android."); return; }
  speechSynthesis.cancel();
  listening ? rec.stop() : rec.start();
};

$('f').onsubmit = e=>{ e.preventDefault(); const v=$('t').value.trim(); if(v){ $('t').value=''; ask(v); } };

// Settings
const dlg = $('dlg');
$('cfg').onclick = ()=>{ $('key').value = store.get('nova_key',''); $('model').value = store.get('nova_model','llama-3.3-70b-versatile'); dlg.showModal(); };
$('cancel').onclick = ()=>dlg.close();
$('save').onclick = ()=>{ store.set('nova_key',$('key').value.trim()); store.set('nova_model',$('model').value.trim()); dlg.close(); };

add('nova', "Hi, I'm Nova. Ask me anything, or say things like \"call\", \"open YouTube\", or \"play Burna Boy\".");
</script>
</body>
</html>
