          cat > $D/ControlPlugin.java <<'JAVA'
          package com.nova.assistant;

          import android.util.DisplayMetrics;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NovaControl")
          public class ControlPlugin extends Plugin {

            private NovaAccessibilityService svc(PluginCall call) {
              NovaAccessibilityService s = NovaAccessibilityService.instance;
              if (s == null) call.reject("service_off");
              return s;
            }

            private void done(PluginCall call, boolean ok) {
              JSObject r = new JSObject();
              r.put("ok", ok);
              call.resolve(r);
            }

            @PluginMethod
            public void status(PluginCall call) {
              JSObject r = new JSObject();
              r.put("enabled", NovaAccessibilityService.instance != null);
              call.resolve(r);
            }

            @PluginMethod
            public void tapText(PluginCall call) {
              NovaAccessibilityService s = svc(call);
              if (s == null) return;
              done(call, s.tapText(call.getString("text", "")));
            }

            @PluginMethod
            public void tap(PluginCall call) {
              NovaAccessibilityService s = svc(call);
              if (s == null) return;
              Integer x = call.getInt("x");
              Integer y = call.getInt("y");
              if (x == null || y == null) {
                call.reject("Need x and y");
                return;
              }
              done(call, s.tap(x.intValue(), y.intValue()));
            }

            @PluginMethod
            public void swipe(PluginCall call) {
              NovaAccessibilityService s = svc(call);
              if (s == null) return;
              String dir = call.getString("direction", "up");
              DisplayMetrics dm = getContext().getResources().getDisplayMetrics();
              float w = dm.widthPixels;
              float h = dm.heightPixels;
              boolean ok;
              if ("left".equals(dir)) ok = s.swipe(w * 0.8f, h / 2f, w * 0.2f, h / 2f, 300);
              else if ("right".equals(dir)) ok = s.swipe(w * 0.2f, h / 2f, w * 0.8f, h / 2f, 300);
              else if ("down".equals(dir)) ok = s.swipe(w / 2f, h * 0.3f, w / 2f, h * 0.75f, 300);
              else ok = s.swipe(w / 2f, h * 0.75f, w / 2f, h * 0.3f, 300);
              done(call, ok);
            }

            @PluginMethod
            public void scroll(PluginCall call) {
              NovaAccessibilityService s = svc(call);
              if (s == null) return;
              done(call, s.scroll("down".equals(call.getString("direction", "down"))));
            }

            @PluginMethod
            public void typeText(PluginCall call) {
              NovaAccessibilityService s = svc(call);
              if (s == null) return;
              done(call, s.typeText(call.getString("text", "")));
            }

            @PluginMethod
            public void press(PluginCall call) {
              NovaAccessibilityService s = svc(call);
              if (s == null) return;
              done(call, s.press(call.getString("action", "back")));
            }

            @PluginMethod
            public void readScreen(PluginCall call) {
              NovaAccessibilityService s = svc(call);
              if (s == null) return;
              String pkg = s.foregroundPackage();
              JSObject r = new JSObject();
              r.put("package", pkg);
              r.put("app", pkg.isEmpty() ? "" : s.appLabel(pkg));
              r.put("text", s.readScreenText(1800));
              call.resolve(r);
            }

            @PluginMethod
            public void foreground(PluginCall call) {
              NovaAccessibilityService s = svc(call);
              if (s == null) return;
              String pkg = s.foregroundPackage();
              JSObject r = new JSObject();
              r.put("package", pkg);
              r.put("app", pkg.isEmpty() ? "" : s.appLabel(pkg));
              call.resolve(r);
            }

            @PluginMethod
            public void watchFor(PluginCall call) {
              NovaAccessibilityService s = svc(call);
              if (s == null) return;
              NovaAccessibilityService.watchHit = "";
              NovaAccessibilityService.watchTerm = call.getString("text", "");
              done(call, true);
            }

            @PluginMethod
            public void stopWatch(PluginCall call) {
              NovaAccessibilityService.watchTerm = "";
              NovaAccessibilityService.watchHit = "";
              done(call, true);
            }

            @PluginMethod
            public void watchStatus(PluginCall call) {
              JSObject r = new JSObject();
              r.put("term", NovaAccessibilityService.watchTerm);
              r.put("hit", NovaAccessibilityService.watchHit);
              if (!NovaAccessibilityService.watchHit.isEmpty()) NovaAccessibilityService.watchHit = "";
              call.resolve(r);
            }
          }
