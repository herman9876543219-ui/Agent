      - name: Add screen control (accessibility) plugin
        run: |
          D=android/app/src/main/java/com/nova/assistant
          R=android/app/src/main/res
          mkdir -p $D $R/xml $R/values
          cat > $R/xml/nova_accessibility_config.xml <<'XML'
