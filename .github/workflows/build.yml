          package com.nova.assistant;

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.provider.Settings;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NovaAssistant")
          public class AssistantPlugin extends Plugin {

            private SharedPreferences prefs() {
              return getContext().getSharedPreferences("nova_prefs", Context.MODE_PRIVATE);
            }

            private boolean isDefaultAssistant() {
              try {
                String pkg = getContext().getPackageName();
                String a = Settings.Secure.getString(getContext().getContentResolver(), "assistant");
                String v = Settings.Secure.getString(getContext().getContentResolver(), "voice_interaction_service");
                return (a != null && a.contains(pkg)) || (v != null && v.contains(pkg));
              } catch (Exception e) {
                return false;
              }
            }

            @PluginMethod
            public void getState(PluginCall call) {
              SharedPreferences p = prefs();
              JSObject r = new JSObject();
              r.put("a11y", NovaAccessibilityService.instance != null);
              r.put("notif", NovaNotificationListener.isEnabled(getContext()));
              r.put("bubble", p.getBoolean("bubble", false));
              r.put("volkey", p.getBoolean("volkey", false));
              r.put("wake", p.getBoolean("wake", false));
              r.put("announce", p.getBoolean("announce", false));
              r.put("screenAI", p.getBoolean("screen_ai", true));
              r.put("isDefault", isDefaultAssistant());
              call.resolve(r);
            }

            @PluginMethod
            public void setOption(PluginCall call) {
              String name = call.getString("name", "");
              String value = call.getString("value", "");
              boolean on = "true".equals(value);
              SharedPreferences.Editor e = prefs().edit();
              try {
                if ("bubble".equals(name)) {
                  e.putBoolean("bubble", on).apply();
                  NovaAccessibilityService s = NovaAccessibilityService.instance;
                  if (s != null) {
                    if (on) s.showBubble();
                    else s.hideBubble();
                  }
                } else if ("volkey".equals(name)) {
                  e.putBoolean("volkey", on).apply();
                } else if ("announce".equals(name)) {
                  e.putBoolean("announce", on).apply();
                } else if ("screenAI".equals(name)) {
                  e.putBoolean("screen_ai", on).apply();
                } else if ("wakeWord".equals(name)) {
                  e.putString("wake_word", value == null || value.trim().isEmpty() ? "nova" : value.trim()).apply();
                } else if ("wake".equals(name)) {
                  e.putBoolean("wake", on).apply();
                  Intent i = new Intent(getContext(), NovaWakeService.class);
                  if (on) {
                    ContextCompat.startForegroundService(getContext(), i);
                  } else {
                    getContext().stopService(i);
                    NovaEngine.get(getContext()).stopWake();
                  }
                } else {
                  call.reject("Unknown option");
                  return;
                }
                call.resolve();
              } catch (Exception ex) {
                call.reject("Could not change that: " + ex.getMessage());
              }
            }

            @PluginMethod
            public void saveConfig(PluginCall call) {
              prefs().edit()
                  .putString("cfg_kind", call.getString("kind", "openai"))
                  .putString("cfg_base", call.getString("base", ""))
                  .putString("cfg_model", call.getString("model", ""))
                  .putString("cfg_key", call.getString("key", ""))
                  .putInt("sim", call.getInt("sim", 0))
                  .apply();
              call.resolve();
            }

            @PluginMethod
            public void trigger(PluginCall call) {
              NovaEngine.get(getContext()).trigger();
              call.resolve();
            }

            @PluginMethod
            public void recentNotifications(PluginCall call) {
              Integer lim = call.getInt("limit");
              boolean msgOnly = call.getBoolean("messagesOnly", true);
              JSObject r = new JSObject();
              r.put("enabled", NovaNotificationListener.isEnabled(getContext()));
              r.put("items", NovaNotificationListener.snapshot(lim == null ? 5 : lim.intValue(), msgOnly));
              call.resolve(r);
            }
          }
