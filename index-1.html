<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Nova</title>
<style>
  :root{--bg:#14110f;--panel:#201b18;--ink:#f3ece4;--mute:#a1968b;--glow:#6ee7c8;--me:#2d2723}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;gap:8px}
  header h1{font-size:20px;margin:0;font-weight:600;flex:1}
  header button{background:none;border:1px solid #3a322d;color:var(--mute);padding:6px 12px;border-radius:8px;font-size:14px}
  header button.active{border-color:var(--glow);color:var(--glow)}
  #log{flex:1;overflow-y:auto;padding:8px 18px;display:flex;flex-direction:column;gap:10px}
  .m{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
  .me{align-self:flex-end;background:var(--me)}
  .nova{align-self:flex-start;background:var(--panel);border-left:3px solid var(--glow)}
  #dock{padding:14px 18px 22px;display:flex;flex-direction:column;align-items:center;gap:12px}
  #status{color:var(--mute);font-size:14px;min-height:20px;text-align:center}
  #mic{width:84px;height:84px;border-radius:50%;border:2px solid var(--glow);background:var(--panel);color:var(--glow);font-size:30px}
  #mic.on{background:var(--glow);color:#0b1f1a;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 14px rgba(110,231,200,.15)}}
  @media (prefers-reduced-motion:reduce){#mic.on{animation:none}}
  #f{display:flex;gap:8px;width:100%}
  input{flex:1;background:var(--panel);border:1px solid #3a322d;color:var(--ink);padding:11px 14px;border-radius:10px;font-size:16px}
  #f button{background:var(--glow);color:#0b1f1a;border:0;padding:0 18px;border-radius:10px;font-weight:600}
  button:focus-visible,input:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
  dialog{background:var(--panel);color:var(--ink);border:1px solid #3a322d;border-radius:14px;width:min(92vw,420px)}
  dialog input{width:100%;margin:6px 0 14px}
  dialog label{font-size:14px;color:var(--mute)}
  dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin:0}
  dialog button{padding:8px 14px;border-radius:8px;border:1px solid #3a322d;background:none;color:var(--ink)}
  dialog button.go{background:var(--glow);color:#0b1f1a;border:0}
  #bat{width:100%;margin-bottom:14px}
</style>
</head>
<body>
<header>
  <h1>Nova</h1>
  <button id="always" aria-pressed="false">Always on</button>
  <button id="cfg">Settings</button>
</header>
<div id="log" aria-live="polite"></div>
<div id="dock">
  <div id="status">Tap the mic and speak</div>
  <button id="mic" aria-label="Talk to Nova">🎤</button>
  <form id="f"><input id="t" placeholder="Or type a message" autocomplete="off"><button>Send</button></form>
</div>

<dialog id="dlg">
  <label for="key">Groq API key (saved only on this phone)</label>
  <input id="key" type="password" placeholder="gsk_...">
  <label for="model">Model</label>
  <input id="model">
  <label for="cc">Country code for WhatsApp (digits only)</label>
  <input id="cc" inputmode="numeric">
  <button id="bat" type="button">Open battery settings (set Nova to Unrestricted)</button>
  <menu><button id="cancel" type="button">Close</button><button id="save" class="go" type="button">Save</button></menu>
</dialog>

<script>
const $ = id => document.getElementById(id);
const reg = window.Capacitor && window.Capacitor.registerPlugin;
const SR = reg ? reg('SpeechRecognition') : null;
const Nova = reg ? reg('Nova') : null;
const log = $('log'), statusEl = $('status'), mic = $('mic'), alwaysBtn = $('always');
const store = { get:(k,d)=>localStorage.getItem(k)||d, set:(k,v)=>localStorage.setItem(k,v) };
const DEFAULT_MODEL = 'openai/gpt-oss-120b';
const IDLE = 'Tap the mic and speak';
let history = [], always = false, busy = false;

const SYSTEM = "You are Nova, a friendly, quick voice assistant on the user's Android phone. Keep replies short (1-3 sentences) because they are spoken aloud. No markdown, no emojis, no lists.";

const sleep = ms => new Promise(r => setTimeout(r, ms));
const withTimeout = (p, ms) => Promise.race([p, sleep(ms)]);

function add(role, text){
  const d = document.createElement('div');
  d.className = 'm ' + (role==='me' ? 'me' : 'nova');
  d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
async function say(text){
  add('nova', text);
  try{ if(Nova) await withTimeout(Nova.speak({text}), 30000); }catch(e){}
}

// ---------- phone actions ----------
async function openUrl(u){
  try{ await Nova.openUrl({url:u}); }catch(e){ await say("I couldn't open that."); }
}
async function findContact(name){
  const r = await Nova.findContact({name});
  return r.matches || [];
}
function waNumber(raw){
  let n = (raw||'').replace(/[^\d+]/g,'');
  if(n.startsWith('+')) return n.slice(1);
  if(n.startsWith('00')) return n.slice(2);
  if(n.startsWith('0')) return store.get('nova_cc','234') + n.slice(1);
  return n;
}

const APP_URLS = {'youtube music':'https://music.youtube.com',spotify:'https://open.spotify.com',youtube:'https://www.youtube.com',google:'https://www.google.com',whatsapp:'https://wa.me/',facebook:'https://www.facebook.com',twitter:'https://x.com',instagram:'https://www.instagram.com',tiktok:'https://www.tiktok.com',gmail:'https://mail.google.com',maps:'https://maps.google.com',telegram:'https://t.me/'};

async function localCommand(q){
  const s = q.toLowerCase().trim().replace(/[.!?]+$/,'');
  let m;
  if(/^(what('s| is) the )?time$|what time is it/.test(s)){
    await say("It's " + new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})); return true;
  }
  if(/what('s| is) (the )?date|today's date|what day is it/.test(s)){
    await say("Today is " + new Date().toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'})); return true;
  }
  if((m = s.match(/^(?:open|go to)\s+(.+)$/)) && APP_URLS[m[1]]){
    await say("Opening " + m[1]); await openUrl(APP_URLS[m[1]]); return true;
  }
  if((m = s.match(/^(?:search|google)(?: for)?\s+(.+)/))){
    await say("Searching for " + m[1]); await openUrl('https://www.google.com/search?q='+encodeURIComponent(m[1])); return true;
  }
  if((m = s.match(/^play\s+(.+)/))){
    await say("Playing " + m[1] + " on YouTube"); await openUrl('https://www.youtube.com/results?search_query='+encodeURIComponent(m[1])); return true;
  }
  if((m = s.match(/^(?:call|phone|dial)\s+(.+)/))){
    try{
      const list = await findContact(m[1]);
      if(!list.length){ await say("I couldn't find " + m[1] + " in your contacts."); return true; }
      await say("Calling " + list[0].name);
      await Nova.callNumber({number:list[0].number});
    }catch(e){ await say("I couldn't place that call: " + (e.message||e)); }
    return true;
  }
  if((m = s.match(/^(whatsapp|message|text|sms)\s+(.+?)(?:\s+(?:saying|that says|say)\s+(.+))?$/))){
    const via = m[1], who = m[2], body = m[3] || '';
    try{
      const list = await findContact(who);
      if(!list.length){ await say("I couldn't find " + who + " in your contacts."); return true; }
      const c = list[0];
      if(via === 'text' || via === 'sms'){
        await say("Opening a text to " + c.name);
        await openUrl('sms:' + c.number.replace(/\s/g,'') + (body ? '?body=' + encodeURIComponent(body) : ''));
      }else{
        await say("Opening WhatsApp for " + c.name);
        await openUrl('https://wa.me/' + waNumber(c.number) + (body ? '?text=' + encodeURIComponent(body) : ''));
      }
    }catch(e){ await say("I couldn't do that: " + (e.message||e)); }
    return true;
  }
  return false;
}

// ---------- AI ----------
async function ask(q){
  add('me', q);
  statusEl.textContent = 'Thinking...';
  try{
    if(await localCommand(q)) return;
    const key = store.get('nova_key','');
    if(!key){ await say("Add your Groq API key in Settings first."); return; }
    history.push({role:'user', content:q});
    history = history.slice(-12);
    const model = store.get('nova_model', DEFAULT_MODEL);
    const body = {model, messages:[{role:'system',content:SYSTEM},...history], max_tokens:900};
    if(model.includes('gpt-oss')) body.reasoning_effort = 'low';
    const r = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
      body:JSON.stringify(body)
    });
    const j = await r.json();
    if(!r.ok) throw new Error((j.error && j.error.message) || r.status);
    const a = ((j.choices[0].message.content) || '').trim() || "Sorry, I didn't get an answer.";
    history.push({role:'assistant', content:a});
    await say(a);
  }catch(e){ await say("Something went wrong: " + (e.message||e)); }
  finally{ statusEl.textContent = always ? 'Listening...' : IDLE; }
}

// ---------- listening ----------
async function ensureMic(){
  if(!SR){ await say("Speech recognition isn't available in this build."); return false; }
  try{
    const r = await SR.requestPermissions();
    if(r.speechRecognition !== 'granted'){ await say("Please allow microphone access for Nova in Android settings."); return false; }
    return true;
  }catch(e){ await say("Microphone error: " + (e.message||e)); return false; }
}
async function listenOnce(){
  try{
    statusEl.textContent = 'Listening...'; mic.classList.add('on');
    const r = await SR.start({language:'en-US', maxResults:1, partialResults:false, popup:false});
    return (r && r.matches && r.matches[0]) || null;
  }catch(e){ return null; }
  finally{ mic.classList.remove('on'); }
}

mic.onclick = async () => {
  if(always) return;
  if(busy){ try{ await SR.stop(); }catch(e){} return; }
  if(!(await ensureMic())) return;
  busy = true;
  try{ if(Nova) await Nova.stopSpeaking(); }catch(e){}
  const q = await listenOnce();
  if(q) await ask(q); else statusEl.textContent = IDLE;
  busy = false;
};

async function loop(){
  while(always){
    const q = await listenOnce();
    if(!always) break;
    if(q) await ask(q); else await sleep(500);
  }
}

alwaysBtn.onclick = async () => {
  if(!always){
    if(!(await ensureMic())) return;
    try{ await Nova.startService(); }catch(e){ await say("Couldn't start background mode: " + (e.message||e)); return; }
    always = true; busy = true;
    alwaysBtn.classList.add('active'); alwaysBtn.setAttribute('aria-pressed','true');
    await say("I'm listening in the background.");
    loop();
  }else{
    always = false; busy = false;
    alwaysBtn.classList.remove('active'); alwaysBtn.setAttribute('aria-pressed','false');
    try{ await SR.stop(); }catch(e){}
    try{ await Nova.stopService(); }catch(e){}
    mic.classList.remove('on'); statusEl.textContent = IDLE;
  }
};

$('f').onsubmit = e => { e.preventDefault(); const v=$('t').value.trim(); if(v){ $('t').value=''; ask(v); } };

// ---------- settings ----------
const dlg = $('dlg');
$('cfg').onclick = () => {
  $('key').value = store.get('nova_key','');
  $('model').value = store.get('nova_model', DEFAULT_MODEL);
  $('cc').value = store.get('nova_cc','234');
  dlg.showModal();
};
$('cancel').onclick = () => dlg.close();
$('save').onclick = () => {
  store.set('nova_key', $('key').value.trim());
  store.set('nova_model', $('model').value.trim() || DEFAULT_MODEL);
  store.set('nova_cc', $('cc').value.replace(/\D/g,'') || '234');
  dlg.close();
};
$('bat').onclick = async () => { try{ await Nova.batterySettings(); }catch(e){} };

add('nova', 'Hi, I\'m Nova. Tap the mic, or turn on "Always on" to keep listening in the background. Try "call", "open YouTube", or "play Burna Boy".');
</script>
</body>
</html>
