          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRequestFilterKeyEvents"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canRequestFilterKeyEvents="true"
              android:notificationTimeout="100"
              android:description="@string/nova_a11y_description" />
          XML
          cat > $R/values/nova_strings.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="nova_a11y_description">Lets Nova read the screen, tap, type and scroll when you ask her to.</string>
          </resources>
          XML
          cat > $D/NovaAccessibilityService.java <<'JAVA'
          package com.nova.assistant;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.util.DisplayMetrics;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.List;

          public class NovaAccessibilityService extends AccessibilityService {

            public static NovaAccessibilityService instance;
            public static volatile String watchTerm = "";
            public static volatile String watchHit = "";
            private long lastCheck = 0;

            private final Handler uiHandler = new Handler(Looper.getMainLooper());
            private WindowManager wm;
            private TextView bubble;
            private GradientDrawable bubbleBg;

            private boolean volDown = false;
            private boolean volLong = false;
            private Runnable volRunnable;

            @Override
            protected void onServiceConnected() {
              super.onServiceConnected();
              instance = this;
              NovaEngine.stateListener = new NovaEngine.StateListener() {
                @Override
                public void onState(String state) {
                  setBubbleState(state);
                }
              };
              SharedPreferences p = getSharedPreferences("nova_prefs", Context.MODE_PRIVATE);
              if (p.getBoolean("bubble", false)) showBubble();
            }

            @Override
            public boolean onUnbind(Intent intent) {
              instance = null;
              hideBubble();
              return super.onUnbind(intent);
            }

            @Override
            public void onDestroy() {
              instance = null;
              hideBubble();
              super.onDestroy();
            }

            @Override
            public void onInterrupt() {
            }

            @Override
            public void onAccessibilityEvent(AccessibilityEvent event) {
              String term = watchTerm;
              if (event == null || term == null || term.isEmpty()) return;
              long now = System.currentTimeMillis();
              if (now - lastCheck < 1000) return;
              lastCheck = now;
              String text = readScreenText(4000);
              if (text.toLowerCase().contains(term.toLowerCase())) {
                watchHit = term;
                watchTerm = "";
                alertUser("Nova found: " + term);
              }
            }

            /* ----- volume-up long press shortcut ----- */

            @Override
            protected boolean onKeyEvent(KeyEvent event) {
              if (event.getKeyCode() != KeyEvent.KEYCODE_VOLUME_UP) return false;
              SharedPreferences p = getSharedPreferences("nova_prefs", Context.MODE_PRIVATE);
              if (!p.getBoolean("volkey", false)) return false;
              if (event.getAction() == KeyEvent.ACTION_DOWN) {
                if (!volDown) {
                  volDown = true;
                  volLong = false;
                  volRunnable = new Runnable() {
                    @Override
                    public void run() {
                      volLong = true;
                      NovaEngine.get(getApplicationContext()).trigger();
                    }
                  };
                  uiHandler.postDelayed(volRunnable, 700);
                }
                return true;
              }
              if (event.getAction() == KeyEvent.ACTION_UP) {
                if (volRunnable != null) uiHandler.removeCallbacks(volRunnable);
                boolean wasLong = volLong;
                volDown = false;
                volLong = false;
                if (!wasLong) {
                  try {
                    AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                    am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI);
                  } catch (Exception ignored) {
                  }
                }
                return true;
              }
              return false;
            }

            /* ----- floating Nova button ----- */

            public void showBubble() {
              uiHandler.post(new Runnable() {
                @Override
                public void run() {
                  addBubbleNow();
                }
              });
            }

            public void hideBubble() {
              uiHandler.post(new Runnable() {
                @Override
                public void run() {
                  removeBubbleNow();
                }
              });
            }

            private void addBubbleNow() {
              if (bubble != null) return;
              try {
                wm = (WindowManager) getSystemService(Context.WINDOW_SERVICE);
                final DisplayMetrics dm = getResources().getDisplayMetrics();
                final float d = dm.density;
                final int size = (int) (56 * d);

                TextView v = new TextView(this);
                v.setText("N");
                v.setGravity(Gravity.CENTER);
                v.setTextColor(0xFF14120A);
                v.setTextSize(22);
                v.setTypeface(Typeface.DEFAULT_BOLD);
                GradientDrawable g = new GradientDrawable();
                g.setShape(GradientDrawable.OVAL);
                g.setColor(0xFFFFE600);
                g.setStroke((int) (2 * d), 0x66000000);
                v.setBackground(g);

                final WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                    size, size,
                    WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                    PixelFormat.TRANSLUCENT);
                lp.gravity = Gravity.TOP | Gravity.START;
                SharedPreferences p = getSharedPreferences("nova_prefs", Context.MODE_PRIVATE);
                lp.x = p.getInt("bubble_x", dm.widthPixels - size - (int) (8 * d));
                lp.y = p.getInt("bubble_y", (int) (dm.heightPixels * 0.35f));

                v.setOnTouchListener(new View.OnTouchListener() {
                  private int startX;
                  private int startY;
                  private float touchX;
                  private float touchY;
                  private boolean moved;

                  @Override
                  public boolean onTouch(View view, MotionEvent e) {
                    switch (e.getAction()) {
                      case MotionEvent.ACTION_DOWN:
                        startX = lp.x;
                        startY = lp.y;
                        touchX = e.getRawX();
                        touchY = e.getRawY();
                        moved = false;
                        return true;
                      case MotionEvent.ACTION_MOVE: {
                        float dx = e.getRawX() - touchX;
                        float dy = e.getRawY() - touchY;
                        if (Math.abs(dx) > 12 || Math.abs(dy) > 12) moved = true;
                        if (moved) {
                          lp.x = startX + (int) dx;
                          lp.y = startY + (int) dy;
                          try {
                            wm.updateViewLayout(view, lp);
                          } catch (Exception ignored) {
                          }
                        }
                        return true;
                      }
                      case MotionEvent.ACTION_UP:
                        if (!moved) {
                          NovaEngine.get(getApplicationContext()).trigger();
                        } else {
                          getSharedPreferences("nova_prefs", Context.MODE_PRIVATE).edit()
                              .putInt("bubble_x", lp.x).putInt("bubble_y", lp.y).apply();
                        }
                        return true;
                      default:
                        return false;
                    }
                  }
                });

                wm.addView(v, lp);
                bubble = v;
                bubbleBg = g;
              } catch (Exception e) {
                bubble = null;
                bubbleBg = null;
              }
            }

            private void removeBubbleNow() {
              try {
                if (bubble != null && wm != null) wm.removeView(bubble);
              } catch (Exception ignored) {
              }
              bubble = null;
              bubbleBg = null;
            }

            public void setBubbleState(String s) {
              if (bubbleBg == null) return;
              int c = 0xFFFFE600;
              if ("listening".equals(s)) c = 0xFF19F58B;
              else if ("thinking".equals(s)) c = 0xFFFF8A1F;
              else if ("speaking".equals(s)) c = 0xFF3DA9FF;
              bubbleBg.setColor(c);
              if (bubble != null) bubble.invalidate();
            }

            private void alertUser(String msg) {
              try {
                Toast.makeText(getApplicationContext(), msg, Toast.LENGTH_LONG).show();
                Vibrator v = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                if (v != null) {
                  if (Build.VERSION.SDK_INT >= 26) {
                    v.vibrate(VibrationEffect.createOneShot(600, VibrationEffect.DEFAULT_AMPLITUDE));
                  } else {
                    v.vibrate(600);
                  }
                }
              } catch (Exception ignored) {
              }
            }

            /* ----- reading ----- */

            public String foregroundPackage() {
              AccessibilityNodeInfo root = getRootInActiveWindow();
              if (root == null || root.getPackageName() == null) return "";
              return root.getPackageName().toString();
            }

            public String appLabel(String pkg) {
              try {
                PackageManager pm = getPackageManager();
                return pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
              } catch (Exception e) {
                return pkg;
              }
            }

            public String readScreenText(int max) {
              AccessibilityNodeInfo root = getRootInActiveWindow();
              if (root == null) return "";
              StringBuilder sb = new StringBuilder();
              collect(root, sb, max, 0);
              return sb.toString().trim();
            }

            private void collect(AccessibilityNodeInfo n, StringBuilder sb, int max, int depth) {
              if (n == null || sb.length() >= max || depth > 40) return;
              if (n.isVisibleToUser()) {
                CharSequence t = n.getText();
                if (t != null && t.length() > 0) {
                  sb.append(t).append(". ");
                } else {
                  CharSequence d = n.getContentDescription();
                  if (d != null && d.length() > 0) sb.append(d).append(". ");
                }
              }
              for (int i = 0; i < n.getChildCount(); i++) {
                collect(n.getChild(i), sb, max, depth + 1);
              }
            }

            /* ----- tapping ----- */

            public boolean tapText(String text) {
              AccessibilityNodeInfo root = getRootInActiveWindow();
              if (root == null || text == null || text.isEmpty()) return false;
              List<AccessibilityNodeInfo> nodes = root.findAccessibilityNodeInfosByText(text);
              if (nodes != null) {
                for (AccessibilityNodeInfo n : nodes) {
                  if (clickNode(n)) return true;
                }
              }
              AccessibilityNodeInfo d = findByDesc(root, text.toLowerCase(), 0);
              return d != null && clickNode(d);
            }

            private AccessibilityNodeInfo findByDesc(AccessibilityNodeInfo n, String q, int depth) {
              if (n == null || depth > 40) return null;
              CharSequence d = n.getContentDescription();
              if (d != null && d.toString().toLowerCase().contains(q)) return n;
              for (int i = 0; i < n.getChildCount(); i++) {
                AccessibilityNodeInfo r = findByDesc(n.getChild(i), q, depth + 1);
                if (r != null) return r;
              }
              return null;
            }

            private boolean clickNode(AccessibilityNodeInfo n) {
              AccessibilityNodeInfo cur = n;
              int guard = 0;
              while (cur != null && guard++ < 8) {
                if (cur.isClickable() && cur.isEnabled()) {
                  return cur.performAction(AccessibilityNodeInfo.ACTION_CLICK);
                }
                cur = cur.getParent();
              }
              Rect r = new Rect();
              n.getBoundsInScreen(r);
              return tap(r.centerX(), r.centerY());
            }

            public boolean tap(float x, float y) {
              if (Build.VERSION.SDK_INT < 24) return false;
              Path p = new Path();
              p.moveTo(x, y);
              GestureDescription g = new GestureDescription.Builder()
                  .addStroke(new GestureDescription.StrokeDescription(p, 0, 60))
                  .build();
              return dispatchGesture(g, null, null);
            }

            public boolean swipe(float x1, float y1, float x2, float y2, long ms) {
              if (Build.VERSION.SDK_INT < 24) return false;
              Path p = new Path();
              p.moveTo(x1, y1);
              p.lineTo(x2, y2);
              GestureDescription g = new GestureDescription.Builder()
                  .addStroke(new GestureDescription.StrokeDescription(p, 0, ms))
                  .build();
              return dispatchGesture(g, null, null);
            }

            /* ----- scrolling ----- */

            public boolean scroll(boolean down) {
              AccessibilityNodeInfo root = getRootInActiveWindow();
              AccessibilityNodeInfo s = root == null ? null : findScrollable(root, 0, null);
              if (s != null) {
                int act = down ? AccessibilityNodeInfo.ACTION_SCROLL_FORWARD : AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD;
                if (s.performAction(act)) return true;
              }
              DisplayMetrics dm = getResources().getDisplayMetrics();
              float x = dm.widthPixels / 2f;
              float hi = dm.heightPixels * 0.72f;
              float lo = dm.heightPixels * 0.28f;
              return down ? swipe(x, hi, x, lo, 350) : swipe(x, lo, x, hi, 350);
            }

            private AccessibilityNodeInfo findScrollable(AccessibilityNodeInfo n, int depth, AccessibilityNodeInfo best) {
              if (n == null || depth > 40) return best;
              if (n.isScrollable()) {
                if (best == null || area(n) > area(best)) best = n;
              }
              for (int i = 0; i < n.getChildCount(); i++) {
                best = findScrollable(n.getChild(i), depth + 1, best);
              }
              return best;
            }

            private long area(AccessibilityNodeInfo n) {
              Rect r = new Rect();
              n.getBoundsInScreen(r);
              return (long) r.width() * (long) r.height();
            }

            /* ----- typing ----- */

            public boolean typeText(String text) {
              AccessibilityNodeInfo root = getRootInActiveWindow();
              if (root == null || text == null) return false;
              AccessibilityNodeInfo f = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT);
              if (f == null || !f.isEditable()) f = findEditable(root, 0);
              if (f == null) return false;
              CharSequence existing = f.getText();
              String base = existing == null ? "" : existing.toString();
              if (Build.VERSION.SDK_INT >= 26 && f.isShowingHintText()) base = "";
              Bundle args = new Bundle();
              args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, base + text);
              return f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args);
            }

            private AccessibilityNodeInfo findEditable(AccessibilityNodeInfo n, int depth) {
              if (n == null || depth > 40) return null;
              if (n.isEditable()) return n;
              for (int i = 0; i < n.getChildCount(); i++) {
                AccessibilityNodeInfo r = findEditable(n.getChild(i), depth + 1);
                if (r != null) return r;
              }
              return null;
            }

            /* ----- system buttons ----- */

            public boolean press(String action) {
              switch (action) {
                case "back": return performGlobalAction(GLOBAL_ACTION_BACK);
                case "home": return performGlobalAction(GLOBAL_ACTION_HOME);
                case "recents": return performGlobalAction(GLOBAL_ACTION_RECENTS);
                case "notifications": return performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS);
                case "quick_settings": return performGlobalAction(GLOBAL_ACTION_QUICK_SETTINGS);
                case "lock":
                  return Build.VERSION.SDK_INT >= 28 && performGlobalAction(GLOBAL_ACTION_LOCK_SCREEN);
                case "screenshot":
                  return Build.VERSION.SDK_INT >= 28 && performGlobalAction(GLOBAL_ACTION_TAKE_SCREENSHOT);
                default: return false;
              }
            }
          }
