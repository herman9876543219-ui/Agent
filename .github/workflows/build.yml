          package com.nova.assistant;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import androidx.core.app.NotificationCompat;

          public class NovaWakeService extends Service {

            public static volatile boolean running = false;
            private static final String CHANNEL = "nova_wake";

            @Override
            public int onStartCommand(Intent intent, int flags, int startId) {
              try {
                if (Build.VERSION.SDK_INT >= 26) {
                  NotificationChannel ch = new NotificationChannel(CHANNEL, "Nova wake word", NotificationManager.IMPORTANCE_LOW);
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.createNotificationChannel(ch);
                }
                Intent open = new Intent(this, MainActivity.class);
                PendingIntent pi = PendingIntent.getActivity(this, 0, open,
                    PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                Notification n = new NotificationCompat.Builder(this, CHANNEL)
                    .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                    .setContentTitle("Nova is listening")
                    .setContentText("Say \"Hey Nova\" to talk. Tap to open Nova.")
                    .setContentIntent(pi)
                    .setOngoing(true)
                    .build();
                if (Build.VERSION.SDK_INT >= 30) {
                  startForeground(4101, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                } else {
                  startForeground(4101, n);
                }
                running = true;
                NovaEngine.get(this).startWake();
              } catch (Exception e) {
                running = false;
                stopSelf();
              }
              return START_STICKY;
            }

            @Override
            public void onDestroy() {
              running = false;
              NovaEngine.get(this).stopWake();
              super.onDestroy();
            }

            @Override
            public IBinder onBind(Intent intent) {
              return null;
            }
          }
