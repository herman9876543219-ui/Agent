          cat > $D/NovaNotificationListener.java <<'JAVA'
          package com.nova.assistant;

          import android.app.Notification;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import androidx.core.app.NotificationManagerCompat;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class NovaNotificationListener extends NotificationListenerService {

            /** Each row: pkg, app, title, text, time, isMessage ("1" or "0") */
            private static final List<String[]> RECENT = new ArrayList<>();

            private static final List<String> MESSAGING = Arrays.asList(
                "com.whatsapp", "com.whatsapp.w4b", "org.telegram.messenger",
                "com.google.android.apps.messaging", "com.samsung.android.messaging",
                "com.android.mms", "com.facebook.orca", "com.truecaller");

            public static boolean isEnabled(Context c) {
              try {
                return NotificationManagerCompat.getEnabledListenerPackages(c).contains(c.getPackageName());
              } catch (Exception e) {
                return false;
              }
            }

            public static synchronized JSONArray snapshot(int limit, boolean msgOnly) {
              JSONArray out = new JSONArray();
              for (int i = RECENT.size() - 1; i >= 0 && out.length() < limit; i--) {
                String[] r = RECENT.get(i);
                if (msgOnly && !"1".equals(r[5])) continue;
                try {
                  JSONObject o = new JSONObject();
                  o.put("pkg", r[0]);
                  o.put("app", r[1]);
                  o.put("title", r[2]);
                  o.put("text", r[3]);
                  o.put("ts", Long.parseLong(r[4]));
                  out.put(o);
                } catch (Exception ignored) {
                }
              }
              return out;
            }

            private static synchronized void add(String[] r) {
              for (int i = RECENT.size() - 1; i >= 0; i--) {
                String[] x = RECENT.get(i);
                if (x[0].equals(r[0]) && x[2].equals(r[2]) && x[3].equals(r[3])) RECENT.remove(i);
              }
              RECENT.add(r);
              while (RECENT.size() > 60) RECENT.remove(0);
            }

            private String label(String pkg) {
              try {
                PackageManager pm = getPackageManager();
                return pm.getApplicationLabel(pm.getApplicationInfo(pkg, 0)).toString();
              } catch (Exception e) {
                return pkg;
              }
            }

            private void record(StatusBarNotification sbn, boolean announce) {
              try {
                Notification n = sbn.getNotification();
                if (n == null) return;
                if ((n.flags & Notification.FLAG_GROUP_SUMMARY) != 0) return;
                String pkg = sbn.getPackageName();
                if (pkg == null || pkg.equals(getPackageName())) return;
                Bundle e = n.extras;
                if (e == null) return;
                CharSequence title = e.getCharSequence(Notification.EXTRA_TITLE);
                CharSequence text = e.getCharSequence(Notification.EXTRA_TEXT);
                CharSequence big = e.getCharSequence(Notification.EXTRA_BIG_TEXT);
                String body = big != null ? big.toString() : (text != null ? text.toString() : "");
                String t = title == null ? "" : title.toString();
                if (t.isEmpty() && body.isEmpty()) return;
                boolean msg = Notification.CATEGORY_MESSAGE.equals(n.category) || MESSAGING.contains(pkg);
                String app = label(pkg);
                add(new String[] { pkg, app, t, body, String.valueOf(sbn.getPostTime()), msg ? "1" : "0" });
                if (announce && msg && !body.isEmpty()) {
                  SharedPreferences p = getSharedPreferences("nova_prefs", Context.MODE_PRIVATE);
                  if (p.getBoolean("announce", false)) {
                    NovaEngine.get(this).announce("New message from " + t + " on " + app + ". " + body);
                  }
                }
              } catch (Exception ignored) {
              }
            }

            @Override
            public void onNotificationPosted(StatusBarNotification sbn) {
              record(sbn, true);
            }

            @Override
            public void onListenerConnected() {
              try {
                StatusBarNotification[] active = getActiveNotifications();
                if (active != null) {
                  for (StatusBarNotification s : active) record(s, false);
                }
              } catch (Exception ignored) {
              }
            }
          }
