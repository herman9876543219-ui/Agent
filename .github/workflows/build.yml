name: Build Nova APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir -p www assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npm init -y
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app-launcher@7 @capacitor-community/contacts@7 @capacitor-community/speech-recognition@7
          npx cap init Nova com.nova.assistant --web-dir www
          npx cap add android

      - name: Add app-opening plugin
        run: |
          D=android/app/src/main/java/com/nova/assistant
          mkdir -p $D
          cat > $D/AppsPlugin.java <<'JAVA'
          package com.nova.assistant;

          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.List;

          @CapacitorPlugin(name = "Apps")
          public class AppsPlugin extends Plugin {

            @PluginMethod
            public void list(PluginCall call) {
              PackageManager pm = getContext().getPackageManager();
              Intent main = new Intent(Intent.ACTION_MAIN, null);
              main.addCategory(Intent.CATEGORY_LAUNCHER);
              List<ResolveInfo> infos = pm.queryIntentActivities(main, 0);
              JSArray arr = new JSArray();
              for (ResolveInfo ri : infos) {
                JSObject o = new JSObject();
                o.put("name", ri.loadLabel(pm).toString());
                o.put("pkg", ri.activityInfo.packageName);
                arr.put(o);
              }
              JSObject res = new JSObject();
              res.put("apps", arr);
              call.resolve(res);
            }

            @PluginMethod
            public void launch(PluginCall call) {
              String pkg = call.getString("pkg");
              if (pkg == null) {
                call.reject("No package");
                return;
              }
              Intent i = getContext().getPackageManager().getLaunchIntentForPackage(pkg);
              if (i == null) {
                call.reject("Cannot launch");
                return;
              }
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              getContext().startActivity(i);
              call.resolve();
            }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package com.nova.assistant;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(AppsPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA

      - name: Add permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.MAIN" />\n            <category android:name="android.intent.category.LAUNCHER" />\n        </intent>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n    <application#' $M
          cat $M

      - name: Generate app icons
        run: |
          npm install --legacy-peer-deps @capacitor/assets
          npx capacitor-assets generate --android

      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nova-build-${{ github.run_number }}
          name: Nova build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          
