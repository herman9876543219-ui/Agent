name: Build Nova APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir -p www assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npm init -y
          npm install --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app-launcher@7 @capacitor/geolocation@7 @capacitor-community/contacts@7 @capacitor-community/speech-recognition@7
          npx cap init Nova com.nova.assistant --web-dir www
          npx cap add android

      - name: Add app-opening plugin
        run: |
          D=android/app/src/main/java/com/nova/assistant
          mkdir -p $D
          cat > $D/AppsPlugin.java <<'JAVA'
          package com.nova.assistant;

          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.util.List;

          @CapacitorPlugin(name = "Apps")
          public class AppsPlugin extends Plugin {

            @PluginMethod
            public void list(PluginCall call) {
              PackageManager pm = getContext().getPackageManager();
              Intent main = new Intent(Intent.ACTION_MAIN, null);
              main.addCategory(Intent.CATEGORY_LAUNCHER);
              List<ResolveInfo> infos = pm.queryIntentActivities(main, 0);
              JSArray arr = new JSArray();
              for (ResolveInfo ri : infos) {
                JSObject o = new JSObject();
                o.put("name", ri.loadLabel(pm).toString());
                o.put("pkg", ri.activityInfo.packageName);
                arr.put(o);
              }
              JSObject res = new JSObject();
              res.put("apps", arr);
              call.resolve(res);
            }

            @PluginMethod
            public void launch(PluginCall call) {
              String pkg = call.getString("pkg");
              if (pkg == null) {
                call.reject("No package");
                return;
              }
              Intent i = getContext().getPackageManager().getLaunchIntentForPackage(pkg);
              if (i == null) {
                call.reject("Cannot launch");
                return;
              }
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              getContext().startActivity(i);
              call.resolve();
            }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package com.nova.assistant;

          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(AppsPlugin.class);
              registerPlugin(DevicePlugin.class);
              registerPlugin(ControlPlugin.class);
              registerPlugin(AssistantPlugin.class);
              super.onCreate(savedInstanceState);

              ActivityCompat.requestPermissions(this, new String[] {
                "android.permission.RECORD_AUDIO",
                "android.permission.READ_CONTACTS",
                "android.permission.WRITE_CONTACTS",
                "android.permission.CALL_PHONE",
                "android.permission.READ_PHONE_STATE",
                "android.permission.READ_CALL_LOG",
                "android.permission.SEND_SMS",
                "android.permission.READ_SMS",
                "android.permission.ACCESS_FINE_LOCATION",
                "android.permission.ACCESS_COARSE_LOCATION",
                "android.permission.READ_CALENDAR",
                "android.permission.WRITE_CALENDAR",
                "android.permission.CAMERA",
                "android.permission.POST_NOTIFICATIONS",
                "android.permission.READ_MEDIA_IMAGES",
                "android.permission.READ_MEDIA_VIDEO",
                "android.permission.READ_MEDIA_AUDIO",
                "android.permission.READ_EXTERNAL_STORAGE"
              }, 1001);
            }
          }
          JAVA

      - name: Add device plugin
        run: |
          D=android/app/src/main/java/com/nova/assistant
          mkdir -p $D
          cat > $D/DevicePlugin.java <<'JAVA'
          package com.nova.assistant;

          import android.Manifest;
          import android.app.ActivityManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.hardware.Sensor;
          import android.hardware.SensorManager;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.media.AudioManager;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.Uri;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Environment;
          import android.os.StatFs;
          import android.os.SystemClock;
          import android.provider.AlarmClock;
          import android.provider.CalendarContract;
          import android.provider.CallLog;
          import android.provider.Settings;
          import android.telecom.PhoneAccountHandle;
          import android.telecom.TelecomManager;
          import android.telephony.TelephonyManager;
          import android.text.TextUtils;
          import android.util.DisplayMetrics;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.List;
          import java.util.Locale;
          import java.util.TimeZone;

          @CapacitorPlugin(name = "NovaDevice")
          public class DevicePlugin extends Plugin {

            private boolean has(String perm) {
              return ContextCompat.checkSelfPermission(getContext(), perm) == PackageManager.PERMISSION_GRANTED;
            }

            private void startNew(Intent i) {
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              getContext().startActivity(i);
            }

            /* ---------- Calls ---------- */

            @PluginMethod
            public void placeCall(PluginCall call) {
              String number = call.getString("number");
              Integer simObj = call.getInt("sim");
              int sim = simObj == null ? 0 : simObj;
              if (number == null || number.trim().isEmpty()) {
                call.reject("No number");
                return;
              }
              if (!has(Manifest.permission.CALL_PHONE)) {
                call.reject("Phone permission not granted");
                return;
              }
              try {
                Intent i = new Intent(Intent.ACTION_CALL, Uri.fromParts("tel", number.trim(), null));
                if (sim > 0 && has(Manifest.permission.READ_PHONE_STATE)) {
                  try {
                    TelecomManager tm = (TelecomManager) getContext().getSystemService(Context.TELECOM_SERVICE);
                    List<PhoneAccountHandle> accts = tm.getCallCapablePhoneAccounts();
                    if (accts != null && accts.size() >= sim) {
                      i.putExtra(TelecomManager.EXTRA_PHONE_ACCOUNT_HANDLE, accts.get(sim - 1));
                    }
                  } catch (Exception ignored) {
                  }
                }
                startNew(i);
                call.resolve();
              } catch (Exception e) {
                call.reject("Call failed: " + e.getMessage());
              }
            }

            @PluginMethod
            public void lastCalled(PluginCall call) {
              if (!has(Manifest.permission.READ_CALL_LOG)) {
                call.reject("Call log permission not granted");
                return;
              }
              try {
                String n = CallLog.Calls.getLastOutgoingCall(getContext());
                JSObject r = new JSObject();
                r.put("number", n == null ? "" : n);
                call.resolve(r);
              } catch (Exception e) {
                call.reject("Could not read call log: " + e.getMessage());
              }
            }

            /* ---------- Alarms, timers, calendar ---------- */

            @PluginMethod
            public void setAlarm(PluginCall call) {
              Integer h = call.getInt("hour");
              Integer m = call.getInt("minute");
              if (h == null || m == null) {
                call.reject("No time");
                return;
              }
              try {
                Intent i = new Intent(AlarmClock.ACTION_SET_ALARM);
                i.putExtra(AlarmClock.EXTRA_HOUR, h.intValue());
                i.putExtra(AlarmClock.EXTRA_MINUTES, m.intValue());
                i.putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("message", "Nova alarm"));
                i.putExtra(AlarmClock.EXTRA_SKIP_UI, true);
                startNew(i);
                call.resolve();
              } catch (Exception e) {
                call.reject("Alarm failed: " + e.getMessage());
              }
            }

            @PluginMethod
            public void setTimer(PluginCall call) {
              Integer secs = call.getInt("seconds");
              if (secs == null || secs.intValue() <= 0) {
                call.reject("No duration");
                return;
              }
              try {
                Intent i = new Intent(AlarmClock.ACTION_SET_TIMER);
                i.putExtra(AlarmClock.EXTRA_LENGTH, secs.intValue());
                i.putExtra(AlarmClock.EXTRA_MESSAGE, call.getString("message", "Nova timer"));
                i.putExtra(AlarmClock.EXTRA_SKIP_UI, true);
                startNew(i);
                call.resolve();
              } catch (Exception e) {
                call.reject("Timer failed: " + e.getMessage());
              }
            }

            @PluginMethod
            public void addEvent(PluginCall call) {
              try {
                long begin = Long.parseLong(call.getString("begin", "0"));
                long end = Long.parseLong(call.getString("end", "0"));
                Intent i = new Intent(Intent.ACTION_INSERT);
                i.setData(CalendarContract.Events.CONTENT_URI);
                i.putExtra(CalendarContract.Events.TITLE, call.getString("title", "Event"));
                i.putExtra(CalendarContract.EXTRA_EVENT_BEGIN_TIME, begin);
                i.putExtra(CalendarContract.EXTRA_EVENT_END_TIME, end);
                startNew(i);
                call.resolve();
              } catch (Exception e) {
                call.reject("Calendar failed: " + e.getMessage());
              }
            }

            @PluginMethod
            public void calendarEvents(PluginCall call) {
              if (!has(Manifest.permission.READ_CALENDAR)) {
                call.reject("Calendar permission not granted");
                return;
              }
              try {
                long begin = Long.parseLong(call.getString("begin", "0"));
                long end = Long.parseLong(call.getString("end", "0"));
                String[] proj = {
                  CalendarContract.Instances.TITLE,
                  CalendarContract.Instances.BEGIN,
                  CalendarContract.Instances.ALL_DAY
                };
                Cursor c = CalendarContract.Instances.query(getContext().getContentResolver(), proj, begin, end);
                JSArray arr = new JSArray();
                if (c != null) {
                  try {
                    while (c.moveToNext() && arr.length() < 20) {
                      JSObject o = new JSObject();
                      o.put("title", c.getString(0));
                      o.put("begin", c.getLong(1));
                      o.put("allDay", c.getInt(2) == 1);
                      arr.put(o);
                    }
                  } finally {
                    c.close();
                  }
                }
                JSObject r = new JSObject();
                r.put("events", arr);
                call.resolve(r);
              } catch (Exception e) {
                call.reject("Could not read calendar: " + e.getMessage());
              }
            }

            /* ---------- Phone status ---------- */

            @PluginMethod
            public void battery(PluginCall call) {
              Intent b = getContext().registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
              if (b == null) {
                call.reject("Battery info unavailable");
                return;
              }
              int level = b.getIntExtra(BatteryManager.EXTRA_LEVEL, -1);
              int scale = b.getIntExtra(BatteryManager.EXTRA_SCALE, 100);
              int status = b.getIntExtra(BatteryManager.EXTRA_STATUS, -1);
              int temp = b.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0);
              boolean charging = status == BatteryManager.BATTERY_STATUS_CHARGING
                  || status == BatteryManager.BATTERY_STATUS_FULL;
              JSObject r = new JSObject();
              r.put("percent", scale > 0 ? Math.round(level * 100f / scale) : level);
              r.put("charging", charging);
              r.put("temp", Math.round(temp / 10f));
              call.resolve(r);
            }

            @PluginMethod
            public void storage(PluginCall call) {
              try {
                StatFs s = new StatFs(Environment.getDataDirectory().getPath());
                double total = s.getTotalBytes() / 1e9;
                double free = s.getAvailableBytes() / 1e9;
                ActivityManager am = (ActivityManager) getContext().getSystemService(Context.ACTIVITY_SERVICE);
                ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                am.getMemoryInfo(mi);
                int used = (int) Math.round(100.0 * (mi.totalMem - mi.availMem) / mi.totalMem);
                JSObject r = new JSObject();
                r.put("totalGb", Math.round(total * 10) / 10.0);
                r.put("freeGb", Math.round(free * 10) / 10.0);
                r.put("ramUsedPercent", used);
                call.resolve(r);
              } catch (Exception e) {
                call.reject("Storage check failed: " + e.getMessage());
              }
            }

            @PluginMethod
            public void network(PluginCall call) {
              String type = "none";
              try {
                ConnectivityManager cm = (ConnectivityManager) getContext().getSystemService(Context.CONNECTIVITY_SERVICE);
                Network n = cm.getActiveNetwork();
                if (n != null) {
                  NetworkCapabilities c = cm.getNetworkCapabilities(n);
                  if (c != null) {
                    if (c.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)) type = "wifi";
                    else if (c.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR)) type = "mobile";
                    else if (c.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET)) type = "ethernet";
                    else type = "other";
                  }
                }
              } catch (Exception ignored) {
              }
              JSObject r = new JSObject();
              r.put("type", type);
              call.resolve(r);
            }

            @PluginMethod
            public void device(PluginCall call) {
              JSObject r = new JSObject();
              r.put("manufacturer", Build.MANUFACTURER);
              r.put("model", Build.MODEL);
              r.put("android", Build.VERSION.RELEASE);
              r.put("uptimeMs", SystemClock.elapsedRealtime());
              call.resolve(r);
            }

            private String healthName(int h) {
              switch (h) {
                case BatteryManager.BATTERY_HEALTH_GOOD: return "Good";
                case BatteryManager.BATTERY_HEALTH_OVERHEAT: return "Overheating";
                case BatteryManager.BATTERY_HEALTH_DEAD: return "Dead";
                case BatteryManager.BATTERY_HEALTH_OVER_VOLTAGE: return "Over voltage";
                case BatteryManager.BATTERY_HEALTH_COLD: return "Cold";
                case BatteryManager.BATTERY_HEALTH_UNSPECIFIED_FAILURE: return "Failure";
                default: return "Unknown";
              }
            }

            @PluginMethod
            public void fullInfo(PluginCall call) {
              try {
                JSObject r = new JSObject();
                r.put("brand", Build.BRAND);
                r.put("manufacturer", Build.MANUFACTURER);
                r.put("model", Build.MODEL);
                r.put("device", Build.DEVICE);
                r.put("hardware", Build.HARDWARE);
                r.put("board", Build.BOARD);
                r.put("android", Build.VERSION.RELEASE);
                r.put("sdk", Build.VERSION.SDK_INT);
                r.put("patch", Build.VERSION.SECURITY_PATCH);
                r.put("buildId", Build.ID);
                r.put("abis", TextUtils.join(", ", Build.SUPPORTED_ABIS));
                r.put("cores", Runtime.getRuntime().availableProcessors());

                DisplayMetrics dm = getContext().getResources().getDisplayMetrics();
                r.put("screen", dm.widthPixels + " x " + dm.heightPixels);
                r.put("dpi", dm.densityDpi);

                ActivityManager am = (ActivityManager) getContext().getSystemService(Context.ACTIVITY_SERVICE);
                ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                am.getMemoryInfo(mi);
                r.put("ramTotalGb", Math.round(mi.totalMem / 1e8) / 10.0);
                r.put("ramUsedPercent", (int) Math.round(100.0 * (mi.totalMem - mi.availMem) / mi.totalMem));

                StatFs s = new StatFs(Environment.getDataDirectory().getPath());
                r.put("storageTotalGb", Math.round(s.getTotalBytes() / 1e8) / 10.0);
                r.put("storageFreeGb", Math.round(s.getAvailableBytes() / 1e8) / 10.0);

                r.put("devOptions", Settings.Global.getInt(getContext().getContentResolver(), Settings.Global.DEVELOPMENT_SETTINGS_ENABLED, 0) == 1);
                r.put("usbDebugging", Settings.Global.getInt(getContext().getContentResolver(), Settings.Global.ADB_ENABLED, 0) == 1);

                TelephonyManager tm = (TelephonyManager) getContext().getSystemService(Context.TELEPHONY_SERVICE);
                r.put("operator", tm == null ? "" : tm.getNetworkOperatorName());

                SensorManager sm = (SensorManager) getContext().getSystemService(Context.SENSOR_SERVICE);
                r.put("sensors", sm == null ? 0 : sm.getSensorList(Sensor.TYPE_ALL).size());

                Intent b = getContext().registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
                if (b != null) {
                  r.put("batteryHealth", healthName(b.getIntExtra(BatteryManager.EXTRA_HEALTH, 0)));
                  r.put("batteryVolt", b.getIntExtra(BatteryManager.EXTRA_VOLTAGE, 0) / 1000.0);
                  String tech = b.getStringExtra(BatteryManager.EXTRA_TECHNOLOGY);
                  r.put("batteryTech", tech == null ? "" : tech);
                }

                r.put("language", Locale.getDefault().toString());
                r.put("timezone", TimeZone.getDefault().getID());
                r.put("uptimeMs", SystemClock.elapsedRealtime());
                call.resolve(r);
              } catch (Exception e) {
                call.reject("Could not read phone info: " + e.getMessage());
              }
            }

            /* ---------- Controls ---------- */

            @PluginMethod
            public void setVolume(PluginCall call) {
              try {
                AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
                int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                Integer pct = call.getInt("percent");
                String dir = call.getString("direction");
                if (pct != null) {
                  int v = Math.max(0, Math.min(max, Math.round(max * pct / 100f)));
                  am.setStreamVolume(AudioManager.STREAM_MUSIC, v, AudioManager.FLAG_SHOW_UI);
                } else if ("up".equals(dir)) {
                  am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI);
                } else if ("down".equals(dir)) {
                  am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI);
                }
                int cur = am.getStreamVolume(AudioManager.STREAM_MUSIC);
                JSObject r = new JSObject();
                r.put("percent", max > 0 ? Math.round(cur * 100f / max) : 0);
                call.resolve(r);
              } catch (Exception e) {
                call.reject("Volume failed: " + e.getMessage());
              }
            }

            @PluginMethod
            public void setBrightness(PluginCall call) {
              if (!Settings.System.canWrite(getContext())) {
                try {
                  startNew(settingsIntent("write_settings"));
                } catch (Exception ignored) {
                }
                call.reject("needs_permission");
                return;
              }
              try {
                Integer pct = call.getInt("percent");
                String dir = call.getString("direction");
                int cur = Settings.System.getInt(getContext().getContentResolver(), Settings.System.SCREEN_BRIGHTNESS, 128);
                int target = Math.round(cur * 100f / 255f);
                if (pct != null) target = pct;
                else if ("up".equals(dir)) target = Math.min(100, target + 20);
                else if ("down".equals(dir)) target = Math.max(1, target - 20);
                int value = Math.max(1, Math.min(255, Math.round(255 * target / 100f)));
                Settings.System.putInt(getContext().getContentResolver(), Settings.System.SCREEN_BRIGHTNESS_MODE, Settings.System.SCREEN_BRIGHTNESS_MODE_MANUAL);
                Settings.System.putInt(getContext().getContentResolver(), Settings.System.SCREEN_BRIGHTNESS, value);
                JSObject r = new JSObject();
                r.put("percent", Math.round(value * 100f / 255f));
                call.resolve(r);
              } catch (Exception e) {
                call.reject("Brightness failed: " + e.getMessage());
              }
            }

            @PluginMethod
            public void flashlight(PluginCall call) {
              boolean on = call.getBoolean("on", true);
              try {
                CameraManager cm = (CameraManager) getContext().getSystemService(Context.CAMERA_SERVICE);
                String id = null;
                for (String cid : cm.getCameraIdList()) {
                  CameraCharacteristics cc = cm.getCameraCharacteristics(cid);
                  Boolean flash = cc.get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                  Integer facing = cc.get(CameraCharacteristics.LENS_FACING);
                  if (flash != null && flash && facing != null && facing == CameraCharacteristics.LENS_FACING_BACK) {
                    id = cid;
                    break;
                  }
                }
                if (id == null) {
                  call.reject("No flashlight found");
                  return;
                }
                cm.setTorchMode(id, on);
                call.resolve();
              } catch (Exception e) {
                call.reject("Flashlight failed: " + e.getMessage());
              }
            }

            /* ---------- Settings screens ---------- */

            private Intent settingsIntent(String page) {
              Uri self = Uri.parse("package:" + getContext().getPackageName());
              switch (page) {
                case "wifi": return new Intent(Settings.ACTION_WIFI_SETTINGS);
                case "bluetooth": return new Intent(Settings.ACTION_BLUETOOTH_SETTINGS);
                case "display": return new Intent(Settings.ACTION_DISPLAY_SETTINGS);
                case "sound": return new Intent(Settings.ACTION_SOUND_SETTINGS);
                case "battery": return new Intent(Settings.ACTION_BATTERY_SAVER_SETTINGS);
                case "location": return new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS);
                case "apps": return new Intent(Settings.ACTION_APPLICATION_SETTINGS);
                case "accessibility": return new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS);
                case "notification_access": return new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS);
                case "airplane": return new Intent(Settings.ACTION_AIRPLANE_MODE_SETTINGS);
                case "nfc": return new Intent(Settings.ACTION_NFC_SETTINGS);
                case "date": return new Intent(Settings.ACTION_DATE_SETTINGS);
                case "storage": return new Intent(Settings.ACTION_INTERNAL_STORAGE_SETTINGS);
                case "dnd": return new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS);
                case "developer": return new Intent(Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS);
                case "about": return new Intent(Settings.ACTION_DEVICE_INFO_SETTINGS);
                case "assistant": return new Intent(Settings.ACTION_VOICE_INPUT_SETTINGS);
                case "write_settings": return new Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, self);
                case "overlay": return new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, self);
                case "battery_optimization": return new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, self);
                case "app_info": return new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, self);
                case "all_files":
                  if (Build.VERSION.SDK_INT >= 30) {
                    return new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, self);
                  }
                  return new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, self);
                default: return new Intent(Settings.ACTION_SETTINGS);
              }
            }

            @PluginMethod
            public void openSettings(PluginCall call) {
              String page = call.getString("page", "main");
              try {
                startNew(settingsIntent(page));
                call.resolve();
              } catch (Exception e) {
                if ("developer".equals(page)) {
                  try {
                    startNew(settingsIntent("about"));
                    call.resolve();
                    return;
                  } catch (Exception ignored) {
                  }
                }
                call.reject("Could not open settings: " + e.getMessage());
              }
            }

            /* ---------- Files ---------- */

            @PluginMethod
            public void listFiles(PluginCall call) {
              String folder = call.getString("folder", "Download");
              String exts = call.getString("exts", "");
              Integer lim = call.getInt("limit");
              int limit = lim == null ? 10 : lim;
              if (Build.VERSION.SDK_INT >= 30 && !Environment.isExternalStorageManager()) {
                try {
                  startNew(settingsIntent("all_files"));
                } catch (Exception ignored) {
                }
                call.reject("needs_permission");
                return;
              }
              File dir = new File(Environment.getExternalStorageDirectory(), folder);
              File[] all = dir.listFiles();
              List<File> items = new ArrayList<>();
              if (all != null) {
                for (File f : all) {
                  if (!f.isFile() || f.getName().startsWith(".")) continue;
                  if (!exts.isEmpty()) {
                    String n = f.getName().toLowerCase();
                    int d = n.lastIndexOf('.');
                    String ext = d >= 0 ? n.substring(d + 1) : "";
                    if (!Arrays.asList(exts.split(",")).contains(ext)) continue;
                  }
                  items.add(f);
                }
              }
              Collections.sort(items, (a, b) -> Long.compare(b.lastModified(), a.lastModified()));
              JSArray arr = new JSArray();
              for (int k = 0; k < items.size() && k < limit; k++) {
                File f = items.get(k);
                JSObject o = new JSObject();
                o.put("name", f.getName());
                o.put("size", f.length());
                o.put("modified", f.lastModified());
                arr.put(o);
              }
              JSObject res = new JSObject();
              res.put("count", items.size());
              res.put("files", arr);
              call.resolve(res);
            }
          }
